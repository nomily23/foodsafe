<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodSafe - ניהול מלאי סופר</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">

    <!-- Navbar -->
    <nav class="bg-emerald-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                 FoodSafe <span class="text-xs bg-emerald-700 px-2 py-1 rounded">ניהול עסקים</span>
            </h1>
            <div class="flex items-center gap-4">
                <!-- כפתור מעבר לדף הלקוחות -->
                <a href="customer.html" class="text-xs bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-1.5 rounded-lg transition font-medium shadow-sm">
                     מעבר לתצוגת לקוחות (Community View)
                </a>
                <span id="merchant-id-display" class="text-sm bg-emerald-800 px-3 py-1 rounded-full">מזהה סופר: סופר_מרכז_גבעתיים</span>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Left Column: Add Product Form -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 md:col-span-1">
            <h2 class="text-xl font-semibold text-slate-800 mb-4 flex items-center gap-2">
                הוספת מוצר קרוב לתפוגה
            </h2>
            <form id="product-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">שם המוצר</label>
                    <input type="text" id="title" required placeholder="למשל: יוגורט עיזים 3%" 
                           class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">קטגוריה</label>
                    <select id="category" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="מוצרי חלב">מוצרי חלב</option>
                        <option value="ירקות ופירות">ירקות ופירות</option>
                        <option value="מאפים ולחם">מאפים ולחם</option>
                        <option value="בשר ודגים">בשר ודגים</option>
                        <option value="מוצרים יבשים">מוצרים יבשים</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">מחיר מקורי (₪)</label>
                        <input type="number" id="originalPrice" required step="0.1" placeholder="15.00" 
                               class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">מחיר מוזל (₪) [0 = חינם]</label>
                        <input type="number" id="discountedPrice" value="0" step="0.1" placeholder="5.00" 
                               class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">תאריך תפוגה</label>
                    <input type="date" id="expiryDate" required 
                           class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">כמות זמינה להצלה</label>
                    <input type="number" id="quantity" required min="1" value="1" 
                           class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-emerald-600/20">
                    פרסם מוצר להצלה 
                </button>
            </form>
        </div>

        <!-- Right Column: Active Products List & Filters -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 md:col-span-2">
            <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
                <h2 class="text-xl font-semibold text-slate-800 flex items-center gap-2">
                     המוצרים הפעילים של הסופר שלי
                </h2>
                <button onclick="loadProducts()" class="text-sm bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition">
                     רענן רשימה
                </button>
            </div>

            <!-- Filter Buttons Bar (כולל את כל הקטגוריות המעודכנות) -->
            <div class="flex flex-wrap gap-2 mb-6 border-b pb-4 text-sm">
                <button onclick="filterProducts('all')" id="filter-all" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg transition font-medium">הצג הכל</button>
                <button onclick="filterProducts('free')" id="filter-free" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition">🎁 חינם בלבד (0 ₪)</button>
                <button onclick="filterProducts('מוצרי חלב')" id="filter-מוצרי חלב" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition">מוצרי חלב</button>
                <button onclick="filterProducts('ירקות ופירות')" id="filter-ירקות ופירות" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition">ירקות ופירות</button>
                <button onclick="filterProducts('מאפים ולחם')" id="filter-מאפים ולחם" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition">מאפים ולחם</button>
                <button onclick="filterProducts('בשר ודגים')" id="filter-בשר ודגים" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition">בשר ודגים</button>
                <button onclick="filterProducts('מוצרים יבשים')" id="filter-מוצרים יבשים" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition">מוצרים יבשים</button>
            </div>

            <div id="products-container" class="overflow-x-auto">
                <p class="text-slate-500 text-center py-8">טוען מוצרים...</p>
            </div>
        </div>

    </main>

    <script>
        const API_URL = 'http://localhost:5002/api/merchants';
        const MERCHANT_ID = 'super_givatayim';
        let allProducts = []; 
        let currentFilter = 'all';

        document.getElementById('merchant-id-display').innerText = `מזהה סופר: ${MERCHANT_ID}`;

        // חישוב אוטומטי של מחיר מוזל ותפוגה
        const originalPriceInput = document.getElementById('originalPrice');
        const discountedPriceInput = document.getElementById('discountedPrice');
        const expiryDateInput = document.getElementById('expiryDate');

        function calculateDiscount() {
            const originalPrice = parseFloat(originalPriceInput.value);
            const expiryDateVal = expiryDateInput.value;

            if (isNaN(originalPrice)) return;

            if (expiryDateVal) {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const expiry = new Date(expiryDateVal);
                expiry.setHours(0, 0, 0, 0);

                const diffTime = expiry - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays <= 3 && diffDays >= 0) {
                    discountedPriceInput.value = 0;
                    return;
                }
            }

            const halfPrice = (originalPrice / 2).toFixed(2);
            discountedPriceInput.value = halfPrice;
        }

        originalPriceInput.addEventListener('input', calculateDiscount);
        expiryDateInput.addEventListener('change', calculateDiscount);

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const productData = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                originalPrice: parseFloat(document.getElementById('originalPrice').value),
                discountedPrice: parseFloat(document.getElementById('discountedPrice').value),
                expiryDate: document.getElementById('expiryDate').value,
                quantity: parseInt(document.getElementById('quantity').value)
            };

            try {
                const response = await fetch(`${API_URL}/${MERCHANT_ID}/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                });

                const data = await response.json();
                if (response.ok) {
                    alert('המוצר הועלה בהצלחה לפלטפורמה והפך זמין לתושבים!');
                    document.getElementById('product-form').reset();
                    loadProducts();
                } else {
                    alert('שגיאה: ' + (data.error || 'לא ניתן להעלות את המוצר'));
                }
            } catch (err) {
                console.error(err);
                alert('שגיאה בחיבור לשרת');
            }
        });

        async function loadProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '<p class="text-slate-500 text-center py-8">טוען מוצרים...</p>';

            try {
                const response = await fetch(`${API_URL}/${MERCHANT_ID}/products`);
                allProducts = await response.json();
                renderTable(allProducts);
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="text-red-500 text-center py-8">שגיאה בטעינת המוצרים מהשרת.</p>';
            }
        }

        function renderTable(productsToDisplay) {
            const container = document.getElementById('products-container');

            let filtered = productsToDisplay.filter(p => {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const expiry = new Date(p.expiryDate);
                expiry.setHours(0, 0, 0, 0);
                if (expiry < today || p.quantity <= 0) return false;

                if (currentFilter === 'all') return true;
                if (currentFilter === 'free') return p.discountedPrice === 0;
                return p.category === currentFilter;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center py-8">אין כרגע מוצרים תואמים להצגה.</p>';
                return;
            }

            let html = `
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="border-b text-slate-400 text-sm">
                            <th class="pb-3">מוצר</th>
                            <th class="pb-3">קטגוריה</th>
                            <th class="pb-3">מחיר מקורי</th>
                            <th class="pb-3">מחיר הצלה</th>
                            <th class="pb-3">תפוגה ותגיות</th>
                            <th class="pb-3">כמות</th>
                            <th class="pb-3">פעולות</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-sm">
            `;

            filtered.forEach(p => {
                const expiryFormatted = new Date(p.expiryDate).toLocaleDateString('he-IL');
                
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const expiry = new Date(p.expiryDate);
                expiry.setHours(0, 0, 0, 0);
                const diffTime = expiry - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                let badgeHtml = '';
                if (diffDays === 0) {
                    badgeHtml = '<span class="bg-red-100 text-red-700 text-xs px-2 py-0.5 rounded-full font-bold mr-2">🔥 פג תוקף היום!</span>';
                } else if (diffDays <= 3) {
                    badgeHtml = `<span class="bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded-full font-bold mr-2">⚡ עוד ${diffDays} ימים</span>`;
                }

                html += `
                    <tr class="hover:bg-slate-50">
                        <td class="py-3 font-medium text-slate-800">${p.title}</td>
                        <td class="py-3 text-slate-600">${p.category}</td>
                        <td class="py-3 text-slate-400 line-through">₪${p.originalPrice}</td>
                        <td class="py-3 font-bold text-emerald-600">₪${p.discountedPrice}</td>
                        <td class="py-3 text-red-500 font-medium">
                            ${expiryFormatted} ${badgeHtml}
                        </td>
                        <td class="py-3 text-slate-700">${p.quantity} יחידות</td>
                        <td class="py-3 flex gap-2">
                            <button onclick="updateStatus('${p._id}', 'sold')" class="text-xs bg-amber-50 text-amber-700 hover:bg-amber-100 px-2 py-1 rounded transition">
                                סמן כנמכר
                            </button>
                            <button onclick="deleteProduct('${p._id}')" class="text-xs bg-red-50 text-red-600 hover:bg-red-100 px-2 py-1 rounded transition">
                                מחק לצמיתות 
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function filterProducts(category) {
            currentFilter = category;
            
            document.querySelectorAll('.flex.flex-wrap.gap-2.mb-6 button').forEach(btn => {
                btn.className = "bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition";
            });
            
            const activeBtn = document.getElementById(`filter-${category}`);
            if (activeBtn) {
                activeBtn.className = "bg-emerald-600 text-white px-3 py-1.5 rounded-lg transition font-medium";
            }

            renderTable(allProducts);
        }

        async function updateStatus(productId, status) {
            try {
                await fetch(`${API_URL}/products/${productId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status, quantity: 0 })
                });
                loadProducts();
            } catch (err) {
                alert('שגיאה בעדכון המוצר');
            }
        }

        async function deleteProduct(productId) {
            if (!confirm('האם את בטוחה שאת רוצה למחוק את המוצר לגמרי מהמערכת?')) return;

            try {
                const response = await fetch(`${API_URL}/products/${productId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadProducts();
                } else {
                    alert('שגיאה במחיקת המוצר');
                }
            } catch (err) {
                console.error(err);
                alert('שגיאה בחיבור לשרת');
            }
        }

        loadProducts();
    </script>
</body>
</html>
